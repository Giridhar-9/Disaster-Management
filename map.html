<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Earth - Weather, Disasters, Drought</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: sans-serif;
      overflow: hidden;
    }

    #map {
      position: absolute;
      top: 70px;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 0;
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      background-color: #0d1117;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      z-index: 1000;
      color: white;
    }

    .navCon1 {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .VSnav h3 {
      margin: 0;
      font-size: 20px;
      cursor: pointer;
    }

    .navLinks a {
      color: white;
      margin-right: 20px;
      text-decoration: none;
      font-weight: 500;
    }

    .navLinks a:hover {
      text-decoration: underline;
    }

    .navCon2 .download {
      background-color: #d73a49;
      color: white;
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #gpsButton {
      position: fixed;
      top: 80px;
      left: 20px;
      z-index: 1000;
      background-color: #1f6feb;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .legend {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: white;
      color: black;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 14px;
      z-index: 1000;
      line-height: 1.6;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.3);
      cursor: pointer;
    }

    #legendContent {
      display: none;
      margin-top: 8px;
      transition: all 0.3s ease;
    }

    .legend span {
      display: inline-block;
      width: 14px;
      height: 14px;
      margin-right: 6px;
      border-radius: 3px;
    }
  </style>
</head>

<body>

  <nav>
    <div class="navCon1">
      <div class="VSnav">
        <h3 onclick="window.open('index.html','_self')">CrisisGuard</h3>
      </div>

      <div class="navLinks" id="navLinks">
        <a href="index.html">Home</a>
        <a onclick="window.open('news.html', '_blank')">News</a>
        <a onclick="window.open('measures.html', '_blank')">Precautions</a>
        <a href="map.html">Map</a>
      </div>
    </div>
    <div class="navCon2">
      <button class="download" onclick="window.open('login.html', '_blank')">Rescue</button>
      <img src="Images/food.png" width="30" id="menu" />
    </div>

  </nav>

  <button id="gpsButton">📍 GPS</button>
  <div id="map"></div>

  <div class="legend" onclick="toggleLegend()">
    <strong>Legend ▼</strong>
    <div id="legendContent">
      <span style="background:red;"></span> Earthquake<br>
      <span style="background:orange;"></span> Wildfire<br>
      <span style="background:blue;"></span> Your Location
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    function toggleLegend() {
      const content = document.getElementById('legendContent');
      const header = document.querySelector('.legend strong');
      const isOpen = content.style.display === 'block';
      content.style.display = isOpen ? 'none' : 'block';
      header.innerHTML = isOpen ? 'Legend ▼' : 'Legend ▲';
    }
    // Initialize Leaflet map
    const map = L.map('map').setView([20, 0], 2);

    // OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);


    // Earthquakes
    fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson')
      .then(res => res.json())
      .then(data => {

        data.features.forEach(eq => {

          const [lon, lat] = eq.geometry.coordinates;
          const mag = eq.properties.mag;
          const place = eq.properties.place;

          if (!isNaN(lat) && !isNaN(lon) && !isNaN(mag)) {

            L.circleMarker([lat, lon], {
              radius: Math.max(mag * 2, 5),
              color: 'red',
              fillColor: 'red',
              fillOpacity: 0.6
            })
              .addTo(map)
              .bindPopup(`
          <b>🌍 Earthquake</b><br>
          Magnitude: ${mag}<br>
          ${place}
        `);

          }
        });

      })
      .catch(error => {
        console.error('Error loading earthquake data:', error);
      });


    // Wildfires
    const wildfireURL =
      'https://services3.arcgis.com/T4QMspbfLg3qTGWY/arcgis/rest/services/WFIGS_Incident_Locations_Current/FeatureServer/0/query?where=1%3D1&outFields=*&outSR=4326&f=geojson';

    fetch(wildfireURL)
      .then(res => res.json())
      .then(data => {

        console.log("Wildfire data:", data);

        data.features.forEach(fire => {

          const coordinates = fire.geometry.coordinates;

          const lon = coordinates[0];
          const lat = coordinates[1];

          if (!isNaN(lat) && !isNaN(lon)) {

            L.circleMarker([lat, lon], {
              radius: 6,
              color: 'orange',
              fillColor: 'orange',
              fillOpacity: 0.8
            })
              .addTo(map)
              .bindPopup('<b>🔥 Wildfire</b>');

          }

        });

      })
      .catch(error => {
        console.error('Error loading wildfire data:', error);
      });

    // GPS
    document.getElementById('gpsButton').addEventListener('click', () => {

      if (!navigator.geolocation) {
        alert('Geolocation is not supported by this browser.');
        return;
      }

      navigator.geolocation.getCurrentPosition(

        position => {

          const lat = position.coords.latitude;
          const lon = position.coords.longitude;

          L.marker([lat, lon])
            .addTo(map)
            .bindPopup('<b>📍 Your Location</b>')
            .openPopup();

          map.setView([lat, lon], 10);

        },

        () => {
          alert('Location access denied.');
        }

      );

    });
    const menuIcon = document.querySelector('#menu');
    const navMenu = document.getElementById('navLinks');

    menuIcon.addEventListener('click', (e) => {
      console.log(e)
      navMenu.classList.toggle('active');
    });

    const navLinks = document.querySelectorAll('.navLinks a');
    navLinks.forEach(link => {
      link.addEventListener('click', () => {
        navMenu.classList.remove('active');
      });
    });
  </script>
</body>

</html>
